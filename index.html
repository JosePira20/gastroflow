<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroFlow | Acceso de Personal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0b0c;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: #141416;
            border: 1px solid #222226;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-card h1 {
            font-size: 1.5em;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            text-align: center;
        }
        .login-card p.subtitle {
            font-size: 0.75em;
            color: #71717a;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #a1a1aa;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0b0b0c;
            border: 1px solid #27272a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9em;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #52525b; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .error-msg {
            color: #ef4444;
            font-size: 0.8em;
            text-align: center;
            margin-top: 15px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>GastroFlow</h1>
        <p class="subtitle">Portal de Personal</p>

        <form id="login-form">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="camarero / cocinero / admin" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" value="1234" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        
        <p id="error-msg" class="error-msg hidden">Credenciales no válidas</p>
    </div>

    <script src="js/MockData.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const userVal = document.getElementById('usuario').value.trim().toLowerCase();
            const passVal = document.getElementById('clave').value;
            const errorMsg = document.getElementById('error-msg');

            const usuarioValido = autenticarUsuario(userVal, passVal);

            if (usuarioValido) {
                errorMsg.classList.add('hidden');
                if (usuarioValido.rol === 'camarero') {
                    window.location.href = 'camarero/index.html';
                } else if (usuarioValido.rol === 'cocinero') {
                    window.location.href = 'cocina/index.html';
                } else if (usuarioValido.rol === 'admin') {
                    window.location.href = 'admin/index.html';
                }
            } else {
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
