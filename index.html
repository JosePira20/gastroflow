<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroFlow | Acceso al Sistema</title>
    <link rel="stylesheet" href="css\styles.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card">
            <div class="brand-header">
                <span class="brand-badge">GASTROFLOW - Proyecto Integrador</span>
                <h1>Inicio de Sesión</h1>
                <p>Ingresar credenciales para acceder al sistema.</p>
            </div>

            <form id="form-login" class="login-form">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ej. EdwardPat" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" placeholder="••••" required autocomplete="current-password">
                </div>

                <div id="login-error" class="error-msg" style="display: none; color: #f87171; font-size: 0.85rem; margin-bottom: 10px;">
                    Usuario o contraseña incorrectos.
                </div>

                <button type="submit" id="btn-submit-login" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="quick-links">
                <span>Vista rápida para comensales:</span>
                <div class="mesas-links">
                    <a href="cliente/index.html?mesa=1">Mesa 01</a>
                    <a href="cliente/index.html?mesa=2">Mesa 02</a>
                    <a href="cliente/index.html?mesa=3">Mesa 03</a>
                    <a href="cliente/index.html?mesa=4">Mesa 04</a>
                    <a href="cliente/index.html?mesa=5">Mesa 05</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/MockData.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const clave = document.getElementById('clave').value.trim();
            const errorBox = document.getElementById('login-error');
            const btn = document.getElementById('btn-submit-login');

            errorBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Verificando en Base de Datos...';

            const user = await autenticarUsuario(usuario, clave);

            if (user) {
                if (user.rol === 'admin') {
                    window.location.href = 'admin/index.html';
                } else if (user.rol === 'cocinero') {
                    window.location.href = 'cocina/index.html';
                } else if (user.rol === 'camarero') {
                    window.location.href = 'camarero/index.html';
                }
            } else {
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
